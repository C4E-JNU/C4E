<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C4E LOGO 圆盘 · 10 版配色试色</title>
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#eef2f6;color:#1f2933;padding:36px 28px 56px}
    h1{font-size:24px;margin-bottom:6px}
    .lead{font-size:13.5px;color:#5b6b7b;margin-bottom:26px;line-height:1.7;max-width:1100px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}
    .cell{background:#fff;border:1px solid #e1e8ef;border-radius:14px;padding:18px 18px 14px;box-shadow:0 2px 8px rgba(30,60,90,.05)}
    .cell .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
    .cell .no{font-size:12px;font-weight:700;color:#fff;background:#64748b;border-radius:6px;padding:1px 7px}
    .cell .nm{font-size:15px;font-weight:700}
    .cell .ds{font-size:12px;color:#7b8794;margin-left:auto}
    .stage{display:flex;align-items:center;gap:16px}
    .mini{display:flex;flex-direction:column;gap:10px;align-items:center}
    .cap{font-size:10.5px;color:#94a3b8}

    .disc{position:relative;overflow:hidden;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
          border:2px solid rgba(255,255,255,.6);box-shadow:0 8px 18px -6px rgba(20,60,100,.28)}
    .disc img{position:relative;z-index:2;display:block;height:auto;object-fit:contain;width:74%;
              filter:drop-shadow(0 5px 10px rgba(0,0,0,.28))}
    .d300{width:260px;height:260px}
    .d64{width:64px;height:64px;border-width:2px}
    .d28{width:28px;height:28px;border-width:1px}
    .d64 img,.d28 img{width:80%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.32))}

    /* ══ 1 沙滩：暖金天空 → 白沙，底部细沙颗粒 ══ */
    .g1{background:
        radial-gradient(2px 2px at 20% 82%, rgba(255,255,255,.7), transparent 60%),
        radial-gradient(2px 2px at 62% 90%, rgba(255,255,255,.6), transparent 60%),
        radial-gradient(2px 2px at 80% 76%, rgba(255,255,255,.55), transparent 60%),
        radial-gradient(1.5px 1.5px at 40% 95%, rgba(255,255,255,.6), transparent 60%),
        linear-gradient(180deg, #ffd18c 0%, #ffe3b8 42%, #f7e3c4 58%, #e7cba4 100%)}
    /* ══ 2 绿意：嫩芽 → 深松绿（上下） ══ */
    .g2{background:linear-gradient(180deg, #d6f2ad 0%, #79c98d 42%, #2e8f62 74%, #14603f 100%)}
    /* ══ 3 春晓：晨光暖白 → 嫩绿 → 草绿（对角） ══ */
    .g3{background:linear-gradient(155deg, #fff6cf 0%, #dff0bd 38%, #a5dcae 70%, #4f9e73 100%)}
    /* ══ 4 樱花：粉白 → 玫瑰粉，飘落花瓣点 ══ */
    .g4{background:
        radial-gradient(4px 3px at 24% 26%, rgba(255,255,255,.85), transparent 70%),
        radial-gradient(3px 2px at 70% 18%, rgba(255,255,255,.75), transparent 70%),
        radial-gradient(5px 3px at 82% 62%, rgba(255,255,255,.6), transparent 70%),
        radial-gradient(3px 2px at 36% 78%, rgba(255,255,255,.55), transparent 70%),
        linear-gradient(165deg, #ffe9f1 0%, #ffb8d1 45%, #ef85ad 75%, #c8527f 100%)}
    /* ══ 5 阳光：日心放射光 + 蜜橘渐变，光芒缓慢转 ══ */
    .g5{background:radial-gradient(circle at 50% 26%, #fffbe0 0 14%, #ffdc7a 40%, #f7a53a 72%, #d96a1f 100%)}
    .g5::before{content:'';position:absolute;inset:-30%;z-index:1;opacity:.4;
        background:conic-gradient(from 0deg, rgba(255,255,255,.55) 0 4deg, transparent 4deg 30deg);
        animation:spin 26s linear infinite}
    /* ══ 6 深海：青 → 宝蓝 → 午夜蓝（上下，最强对比） ══ */
    .g6{background:linear-gradient(180deg, #8ceaf0 0%, #34a3d4 40%, #14589c 72%, #062a52 100%)}
    /* ══ 7 暮紫：丁香 → 靛紫（对角） ══ */
    .g7{background:linear-gradient(140deg, #efe0ff 0%, #b79bf5 45%, #6d43c9 78%, #33176f 100%)}
    /* ══ 8 薄荷：浅薄荷 → 深孔雀绿（随机角 200°） ══ */
    .g8{background:linear-gradient(200deg, #e2fff4 0%, #7defc6 40%, #17a589 75%, #06584f 100%)}
    /* ══ 9 珊瑚：暖桃 → 珊瑚红 → 深莓（对角） ══ */
    .g9{background:linear-gradient(150deg, #ffe0d1 0%, #ff9a7d 42%, #e0506e 76%, #8e1f45 100%)}
    /* ══ 10 晨雾石墨：浅雾 → 中性灰蓝 → 深墨（上下，最百搭） ══ */
    .g10{background:linear-gradient(180deg, #f4f8fb 0%, #c3d3e0 38%, #7b93a8 68%, #2c3e50 100%)}

    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.g5::before{animation:none}}
</style>
</head>
<body>
    <h1>C4E LOGO 圆盘 · 10 版配色试色</h1>
    <div class="lead">
        设计原则：<b>背景与浅蓝 logo 拉开色相或明度</b>，不再出现"配色和 logo 太接近看不清"。
        每版给 260px 大屏、64px 中景、28px 顶栏三档实测。所有底色均为 CSS 渐变，无图片资源，缩放不糊、加载零开销。
    </div>

    <div class="grid" id="grid"></div>

    <script>
    var items = [
        ['1','沙滩','暖金天空→白沙 + 沙粒', 'g1'],
        ['2','绿意','嫩芽→深松绿（上下）', 'g2'],
        ['3','春晓','晨光暖白→草绿（对角）', 'g3'],
        ['4','樱花','粉白→玫瑰粉 + 落瓣', 'g4'],
        ['5','阳光','日心放射光·蜜橘（旋转）', 'g5'],
        ['6','深海','青→宝蓝→午夜蓝（对比最强）', 'g6'],
        ['7','暮紫','丁香→靛紫（对角）', 'g7'],
        ['8','薄荷','浅薄荷→孔雀绿', 'g8'],
        ['9','珊瑚','暖桃→深莓（对角）', 'g9'],
        ['10','晨雾石墨','浅雾→深墨（最百搭）', 'g10']
    ];
    var LOGO = 'assets/icons/c4e-logo.png?v=2';
    document.getElementById('grid').innerHTML = items.map(function(it){
        return '<div class="cell"><div class="hd"><span class="no">' + it[0] + '</span>' +
               '<span class="nm">' + it[1] + '</span><span class="ds">' + it[2] + '</span></div>' +
               '<div class="stage">' +
               '<div class="disc d300 ' + it[3] + '"><img src="' + LOGO + '" alt="C4E"></div>' +
               '<div class="mini"><div class="disc d64 ' + it[3] + '"><img src="' + LOGO + '" alt="C4E"></div><span class="cap">64px</span>' +
               '<div class="disc d28 ' + it[3] + '"><img src="' + LOGO + '" alt="C4E"></div><span class="cap">28px</span></div>' +
               '</div></div>';
    }).join('');
    </script>
</body>
</html>
