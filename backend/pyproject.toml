[project]
name = "c4eai"
version = "0.1.0"
description = "C4EAI · Shared Wiki — 组内科研辅助智能体（共享库 + 图谱检索 + 文献解析 + 联网 + 文件处理）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "C4EAI Contributors" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "websockets>=12",
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "langgraph>=0.2",
    "openai>=1.30",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=17",
    "numexpr>=2.10",
    "bottleneck>=1.4",
    "neo4j>=5.20",
    "fastembed>=0.4",
    "onnxruntime>=1.17",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "pytesseract>=0.3.10",
    "httpx>=0.27",
    "requests>=2.31",
    "duckduckgo_search>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.uv]
package = false
